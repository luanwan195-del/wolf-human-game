<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月夜の村｜オンライン人狼</title>
<style>
:root{--bg:#101522;--panel:#1a2233;--panel2:#222d42;--ink:#f3f6ff;--muted:#aab5cc;--accent:#9e8cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#26314d,#101522 58%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{text-align:center;padding:22px 12px}h1{margin:0;font-size:clamp(26px,6vw,40px)}header p,.muted{color:var(--muted);line-height:1.6}main{max-width:960px;margin:auto;padding:0 12px 40px}.card{background:var(--panel);border:1px solid #39445d;border-radius:16px;padding:16px;margin:12px 0}h2{font-size:20px;margin:0 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}input,select,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #46536e;background:#111827;color:var(--ink);min-width:0}button{cursor:pointer;background:linear-gradient(135deg,#8270ef,#a18cff);border:0;font-weight:700}button.secondary{background:#35415a}button.red{background:#a94360}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}.player{padding:10px;background:var(--panel2);border:1px solid #39445d;border-radius:11px;overflow-wrap:anywhere}.pill{display:inline-block;border-radius:99px;background:#303b55;padding:5px 9px;font-size:12px;margin:2px}.chatlog{height:240px;overflow:auto;background:#0d1320;border:1px solid #35415a;border-radius:10px;padding:10px}.msg{background:#1d2940;border-radius:9px;padding:8px;margin:7px 0;overflow-wrap:anywhere}.who{font-size:12px;color:var(--accent);font-weight:800}.msg p{margin:4px 0;white-space:pre-wrap}.status{font-size:13px;color:var(--muted)}.notice{background:#2a2541;border-radius:10px;padding:10px;line-height:1.6}#roleBox{position:fixed;inset:0;z-index:9;background:#090d16f5;display:flex;align-items:center;justify-content:center;padding:20px}.roleinner{width:min(430px,100%);padding:22px;background:#202a40;border:1px solid #657196;border-radius:20px;text-align:center}.roleinner .icon{font-size:52px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
</style></head><body><header><h1>🌙 月夜の村</h1><p>ルームコードで友達と合流。推理と会話で人狼を見つけよう。</p></header><main>
<section class="card" id="connect"><h2>🔗 ルーム</h2><label class="muted">あなたの名前</label><input id="name" maxlength="18" placeholder="名前" style="width:100%;margin:6px 0 10px"><div class="row"><button id="create">ルームを作る</button><input id="roomCode" maxlength="6" placeholder="6文字のコード"><button id="join" class="secondary">参加する</button></div><p id="connectMsg" class="muted">Firebase設定をしてから遊べます。</p></section>
<section class="card hidden" id="lobby"><div class="row"><h2>🏠 待機ルーム</h2><span class="pill">コード：<b id="codeView"></b></span></div><p class="muted">このコードを友達に共有してね。5〜16人で遊べます。</p><div id="lobbyPlayers" class="grid"></div><div id="hostSettings" class="hidden"><h2 style="margin-top:16px">⚙️ ホスト設定</h2><div class="row"><label>人狼<select id="wolves"><option value="1">1人</option><option value="2" selected>2人</option><option value="3">3人</option></select></label><label>占い師<select id="seer"><option value="yes">あり</option><option value="no">なし</option></select></label><label>騎士<select id="guard"><option value="yes">あり</option><option value="no">なし</option></select></label><label>狂人<select id="madman"><option value="yes" selected>あり</option><option value="no">なし</option></select></label></div><button id="startGame" style="width:100%;margin-top:10px">役職を配って開始</button></div><button id="leave" class="secondary" style="margin-top:12px">退出する</button></section>
<section id="game" class="hidden"><div class="card"><div class="row"><div><span class="pill" id="phase">待機中</span><h2 id="round">ゲーム</h2></div><span class="pill" id="aliveCount">生存 0人</span></div><p id="phaseInfo" class="muted"></p></div><div class="card"><h2>👥 参加者</h2><div id="players" class="grid"></div></div><div class="card"><h2>🎭 あなたの役職</h2><p id="myRole">ゲーム開始まで表示されません。</p><p class="muted" id="myRoleDesc"></p><p id="seerResult" class="notice hidden"></p></div>
<div class="card"><h2>💬 村のチャット</h2><div class="chatlog" id="publicChat"></div><form class="row" id="publicForm" style="margin-top:8px"><input id="publicText" maxlength="240" placeholder="全員へのメッセージ"><button>送信</button></form></div><div class="card hidden" id="wolfCard"><h2>🐺 人狼だけの秘密チャット</h2><div class="chatlog" id="wolfChat"></div><form class="row" id="wolfForm" style="margin-top:8px"><input id="wolfText" maxlength="240" placeholder="人狼だけに送信"><button>送信</button></form></div>
<div class="card"><h2>🎯 あなたの行動</h2><p class="muted" id="actionInfo">行動はここに表示されます。</p><div id="actions" class="grid"></div></div><div class="card hidden" id="hostControls"><h2>👑 ホスト管理</h2><button id="advance" style="width:100%">現在のフェーズを確定して次へ</button><button id="endGame" class="red" style="width:100%;margin-top:8px">ゲームを終了</button></div><div class="card"><h2>📜 ゲームログ</h2><div id="log" class="muted"></div></div></section></main>
<div id="roleBox" class="hidden"><div class="roleinner"><div class="icon" id="roleIcon">🎭</div><h2 id="roleName"></h2><p id="roleDesc"></p><button id="roleClose" style="width:100%">閉じる</button></div></div><div class="footer">月夜の村 • オンライン人狼</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getDatabase,ref,onValue,get,off}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import{getFunctions,httpsCallable}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";
const firebaseConfig={
  apiKey: "AIzaSyDH0JWlFEYBUQDsVC6kXOtpLsupBMRgbZo",
  authDomain: "wolf-human-10e2d.firebaseapp.com",
  databaseURL: "https://wolf-human-10e2d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "wolf-human-10e2d",
  storageBucket: "wolf-human-10e2d.firebasestorage.app",
  messagingSenderId: "1048355377990",
  appId: "1:1048355377990:web:2394c6c214bcd6cf508b47",
  measurementId: "G-8CTG7DNQZL"
};
const $=id=>document.getElementById(id),roles={wolf:["🐺","人狼","夜に襲撃先を選べます。人狼同士の秘密チャットが使えます。"],villager:["🧑‍🌾","村人","能力はありません。会話と投票で人狼を探しましょう。"],seer:["🔮","占い師","夜に1人を占い、人狼かどうか調べられます。"],guard:["🛡️","騎士","夜に1人を襲撃から守れます。"],madman:["🃏","狂人","人狼陣営ですが、人狼が誰かは分かりません。"]};
let app,auth,db,api,uid="",name="",code="",host=false,room={},shownRole="",unsubs=[];
function status(t){$("connectMsg").textContent=t}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function setup(){if(Object.values(firebaseConfig).some(v=>String(v).includes("YOUR_"))){status("README.mdを見て、index.htmlのFirebase設定を置き換えてください。");return false}try{app=initializeApp(firebaseConfig);auth=getAuth(app);await signInAnonymously(auth);uid=auth.currentUser.uid;db=getDatabase(app);api=n=>httpsCallable(getFunctions(app),n);return true}catch(e){status("接続エラー："+e.message);return false}}
async function call(n,data={}){try{return(await api(n)(data)).data}catch(e){alert(e.message||"エラー");throw e}}
function listen(path,cb){const r=ref(db,path);onValue(r,s=>cb(s.val()));unsubs.push(()=>off(r))}
async function create(){if(!await setup())return;name=$("name").value.trim();if(!name)return alert("名前を入力してください");const d=await call("createRoom",{name});code=d.code;host=true;enter()}
async function join(){if(!await setup())return;name=$("name").value.trim();code=$("roomCode").value.trim().toUpperCase();if(!name||!code)return alert("名前とコードを入力してください");await call("joinRoom",{code,name});host=false;enter()}
function enter(){$("connect").classList.add("hidden");$("lobby").classList.remove("hidden");$("codeView").textContent=code;$("hostSettings").classList.toggle("hidden",!host);$("hostControls").classList.toggle("hidden",!host);listen(`rooms/${code}/public`,renderPublic);listen(`rooms/${code}/players`,renderPlayers);listen(`rooms/${code}/chat/public`,d=>renderChat("publicChat",d));listen(`rooms/${code}/chat/wolves`,d=>{if(room.myRole==="wolf")renderChat("wolfChat",d)});listen(`rooms/${code}/private/${uid}`,renderPrivate);listen(`rooms/${code}/events`,renderEvents)}
function renderPublic(d){if(!d)return;room={...room,...d};$("lobby").classList.toggle("hidden",d.status!=="lobby");$("game").classList.toggle("hidden",d.status==="lobby");$("phase").textContent=d.phase==="day"?"☀️ 昼":d.phase==="night"?"🌙 夜":"🏁 終了";$("round").textContent=(d.round||1)+"日目";$("phaseInfo").textContent=d.phaseInfo||"";$("hostControls").classList.toggle("hidden",!host||d.status!=="playing");if(d.status==="ended")$("phaseInfo").textContent=d.phaseInfo+(d.winner?" 勝利："+(d.winner==="wolf"?"人狼陣営":"村人陣営"):"")}
function renderPlayers(ps){if(!ps)return;const a=Object.entries(ps);$("lobbyPlayers").innerHTML=a.map(([id,p])=>`<div class="player">${p.host?"👑 ":""}${esc(p.name)}${id===uid?"（あなた）":""}</div>`).join("");$("players").innerHTML=a.map(([id,p])=>`<div class="player">${p.alive?"🟢":"⚫"} ${esc(p.name)}${p.host?" 👑":""}${id===uid?"（あなた）":""}<div class="status">${p.alive?"生存中":"脱落"}</div></div>`).join("");$("aliveCount").textContent="生存 "+a.filter(([,p])=>p.alive).length+"人"}
function renderPrivate(d){if(!d)return;if(d.role){room.myRole=d.role;$("myRole").textContent=roles[d.role][0]+" "+roles[d.role][1];$("myRoleDesc").textContent=roles[d.role][2];$("wolfCard").classList.toggle("hidden",d.role!=="wolf");if(d.role!==shownRole){shownRole=d.role;$("roleIcon").textContent=roles[d.role][0];$("roleName").textContent=roles[d.role][1];$("roleDesc").textContent=roles[d.role][2];$("roleBox").classList.remove("hidden")}}if(d.seerResult){$("seerResult").classList.remove("hidden");$("seerResult").textContent="占い結果："+d.seerResult.name+" は "+(d.seerResult.isWolf?"人狼です":"人狼ではありません")}if(d.notice)$("actionInfo").textContent=d.notice;renderActions(d)}
function renderActions(d){$("actions").innerHTML="";if(d.alive===false){$("actionInfo").textContent="脱落しています。観戦できます。";return}if(room.status!=="playing")return;if(room.phase==="day"){const b=document.createElement("button");b.textContent="投票する";b.onclick=()=>chooseTarget("vote");$("actions").append(b);$("actionInfo").textContent="昼は話し合い、投票で処刑する人を選びます。"}else if(room.phase==="night"){const r=room.myRole,act={wolf:"attack",seer:"seer",guard:"guard"}[r];if(act){const b=document.createElement("button");b.textContent={attack:"襲撃先を選ぶ",seer:"占う相手を選ぶ",guard:"守る相手を選ぶ"}[act];b.onclick=()=>chooseTarget(act);$("actions").append(b)}else $("actionInfo").textContent="夜です。朝まで待ってください。"}}
async function chooseTarget(action){const snap=await get(ref(db,`rooms/${code}/players`)),ps=snap.val()||{},opts=Object.entries(ps).filter(([id,p])=>p.alive&&(action!=="attack"||id!==uid));const answer=prompt(opts.map(([id,p],i)=>`${i+1}. ${p.name}`).join("\\n")+"\\n番号を入力");const i=Number(answer)-1;if(!Number.isInteger(i)||i<0||i>=opts.length)return;await call("submitAction",{code,action,target:opts[i][0]});alert(action==="vote"?"投票しました":"行動を受け付けました")}
function renderChat(id,data){const el=$(id);el.innerHTML="";Object.values(data||{}).sort((a,b)=>a.time-b.time).slice(-100).forEach(m=>{const d=document.createElement("div");d.className="msg";const w=document.createElement("div");w.className="who";w.textContent=m.name;const p=document.createElement("p");p.textContent=m.text;d.append(w,p);el.append(d)});el.scrollTop=el.scrollHeight}
function renderEvents(d){$("log").innerHTML=Object.values(d||{}).sort((a,b)=>a.time-b.time).slice(-30).map(e=>`<div>• ${esc(e.text)}</div>`).join("")}
async function send(channel,input){const text=$(input).value.trim();if(!text)return;await call("sendChat",{code,channel,text});$(input).value=""}
$("create").onclick=()=>create().catch(e=>status(e.message));$("join").onclick=()=>join().catch(e=>status(e.message));$("startGame").onclick=()=>call("startGame",{code,settings:{wolves:+$("wolves").value,seer:$("seer").value==="yes",guard:$("guard").value==="yes",madman:$("madman").value==="yes"}});$("publicForm").onsubmit=e=>{e.preventDefault();send("public","publicText")};$("wolfForm").onsubmit=e=>{e.preventDefault();send("wolves","wolfText")};$("advance").onclick=()=>call("advancePhase",{code});$("endGame").onclick=()=>call("endGame",{code});$("roleClose").onclick=()=>$("roleBox").classList.add("hidden");$("leave").onclick=async()=>{try{await call("leaveRoom",{code})}catch{}unsubs.forEach(f=>f());location.reload()};
</script></body></html>
